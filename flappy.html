<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>跳躍鳥 — MiniGame Hub</title>
  <meta name="description" content="免費線上跳躍鳥(類似 Flappy Bird):點一下飛一下,躲過水管,挑戰最高分。免下載,手機電腦都能玩。" />
  <meta name="theme-color" content="#0d0f15" />
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="index.html">
        <span class="brand__logo">🎮</span>
        <span>MiniGame <b>Hub</b></span>
      </a>
      <nav class="nav__links"><a class="nav__link" href="index.html#games">全部遊戲</a></nav>
    </div>
  </header>

  <main class="game-page">
    <div class="game-head">
      <a class="back" href="index.html">← 返回</a>
      <h1>🐤 跳躍鳥</h1>
    </div>

    <div class="game-shell">
      <div class="game-score">
        <div class="score-box"><div class="score-box__label">分數</div><div class="score-box__value" id="score">0</div></div>
        <div class="score-box"><div class="score-box__label">最高分</div><div class="score-box__value" id="best">0</div></div>
      </div>

      <div class="game-area overlay">
        <canvas class="game-canvas" id="cv" width="320" height="440"></canvas>
        <div class="overlay__panel" id="overlay">
          <h2 class="overlay__title">🐤 跳躍鳥</h2>
          <p class="overlay__text" id="ov-text">點擊 / 按空白鍵讓小鳥往上飛,躲過水管。</p>
          <button class="btn btn--primary" id="startBtn">開始遊戲</button>
        </div>
      </div>

      <p class="tip">點一下螢幕或按 <kbd>空白鍵</kbd> / <kbd>↑</kbd> 讓小鳥上飛。每過一根水管 +1 分。</p>
    </div>

    <div class="ad-slot"></div>
  </main>

  <script src="js/ads.js" defer></script>
  <script>
  (function () {
    "use strict";
    var cv = document.getElementById("cv");
    var ctx = cv.getContext("2d");
    var W = cv.width, H = cv.height;

    var scoreEl = document.getElementById("score");
    var bestEl = document.getElementById("best");
    var overlay = document.getElementById("overlay");
    var ovText = document.getElementById("ov-text");
    var startBtn = document.getElementById("startBtn");

    var best = +(localStorage.getItem("flappy_best") || 0);
    bestEl.textContent = best;

    var GROUND = 70;            // ground band height
    var BIRD_X = 80;
    var GRAVITY = 0.42;
    var FLAP = -7.2;
    var PIPE_W = 54;
    var GAP = 140;
    var PIPE_SPACING = 210;     // horizontal distance between pipes
    var PIPE_SPEED = 2.4;

    var bird, pipes, score, running, raf, frames;

    function reset() {
      bird = { y: H / 2, vy: 0, r: 14 };
      pipes = [];
      score = 0;
      frames = 0;
      scoreEl.textContent = 0;
    }

    function spawnPipe() {
      var top = 60 + Math.random() * (H - GROUND - GAP - 120);
      pipes.push({ x: W, top: top, passed: false });
    }

    function flap() {
      if (!running) { start(); return; }
      bird.vy = FLAP;
    }

    function step() {
      frames++;
      bird.vy += GRAVITY;
      bird.y += bird.vy;

      // pipes
      for (var i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= PIPE_SPEED;
        if (!pipes[i].passed && pipes[i].x + PIPE_W < BIRD_X) {
          pipes[i].passed = true;
          score++;
          scoreEl.textContent = score;
          if (score > best) { best = score; localStorage.setItem("flappy_best", best); bestEl.textContent = best; }
        }
        if (pipes[i].x + PIPE_W < 0) pipes.splice(i, 1);
      }
      if (frames % Math.round(PIPE_SPACING / PIPE_SPEED) === 0) spawnPipe();

      // collisions
      if (bird.y + bird.r >= H - GROUND || bird.y - bird.r <= 0) return gameOver();
      for (var p = 0; p < pipes.length; p++) {
        var pipe = pipes[p];
        if (BIRD_X + bird.r > pipe.x && BIRD_X - bird.r < pipe.x + PIPE_W) {
          if (bird.y - bird.r < pipe.top || bird.y + bird.r > pipe.top + GAP) return gameOver();
        }
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.fill();
    }

    function draw() {
      // sky gradient
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#1a1e29");
      g.addColorStop(1, "#12151d");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // pipes
      pipes.forEach(function (p) {
        ctx.fillStyle = "#22c55e";
        roundRect(p.x, 0, PIPE_W, p.top, 6);
        roundRect(p.x, p.top + GAP, PIPE_W, H - GROUND - (p.top + GAP), 6);
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        ctx.fillRect(p.x, p.top - 8, PIPE_W, 8);
        ctx.fillRect(p.x, p.top + GAP, PIPE_W, 8);
      });

      // ground
      ctx.fillStyle = "#1a1206";
      ctx.fillRect(0, H - GROUND, W, GROUND);
      ctx.fillStyle = "#2a1d0c";
      for (var i = 0; i < W; i += 24) ctx.fillRect(i - (frames * PIPE_SPEED % 24), H - GROUND, 12, 6);

      // bird
      ctx.save();
      ctx.translate(BIRD_X, bird.y);
      ctx.rotate(Math.max(-0.4, Math.min(0.6, bird.vy * 0.06)));
      ctx.fillStyle = "#facc15";
      ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
      // wing
      ctx.fillStyle = "#f5a524";
      ctx.beginPath(); ctx.ellipse(-2, 3, 8, 5, 0.3, 0, Math.PI * 2); ctx.fill();
      // eye
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(6, -4, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#0d0f15";
      ctx.beginPath(); ctx.arc(7.5, -4, 2, 0, Math.PI * 2); ctx.fill();
      // beak
      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.moveTo(12, -2); ctx.lineTo(20, 1); ctx.lineTo(12, 4); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    function loop(t) {
      if (!running) return;
      step();
      if (!running) return;
      draw();
      raf = requestAnimationFrame(loop);
    }

    function start() {
      reset();
      frames = Math.round(PIPE_SPACING / PIPE_SPEED); // force an immediate pipe spawn
      overlay.classList.add("is-hidden");
      running = true;
      raf = requestAnimationFrame(loop);
    }

    function gameOver() {
      running = false;
      cancelAnimationFrame(raf);
      draw();
      overlay.classList.remove("is-hidden");
      overlay.querySelector(".overlay__title").textContent = "遊戲結束";
      ovText.textContent = "分數 " + score + (score >= best && score > 0 ? " — 新紀錄!" : "");
      startBtn.textContent = "再玩一次";
    }

    function onInput(e) {
      e.preventDefault();
      flap();
    }
    cv.addEventListener("mousedown", onInput);
    cv.addEventListener("touchstart", onInput, { passive: false });
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { e.preventDefault(); flap(); }
    });

    startBtn.addEventListener("click", function (e) { e.stopPropagation(); start(); });

    // idle preview
    reset();
    draw();
  })();
  </script>
</body>
</html>
