<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048 — MiniGame Hub</title>
  <meta name="description" content="免費線上 2048 遊戲:合併相同數字,挑戰 2048 目標。免下載,手機電腦都能玩。" />
  <meta name="theme-color" content="#0d0f15" />
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="nav__inner">
      <a class="brand" href="index.html">
        <span class="brand__logo">🎮</span>
        <span>MiniGame <b>Hub</b></span>
      </a>
      <nav class="nav__links">
        <a class="nav__link" href="index.html#games">全部遊戲</a>
      </nav>
    </div>
  </header>

  <main class="game-page">
    <div class="game-head">
      <a class="back" href="index.html">← 返回</a>
      <h1>🧩 2048</h1>
    </div>

    <div class="game-shell">
      <div class="game-score">
        <div class="score-box">
          <div class="score-box__label">分數</div>
          <div class="score-box__value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-box__label">最高分</div>
          <div class="score-box__value" id="best">0</div>
        </div>
      </div>

      <div class="game-area overlay">
        <div class="grid-2048" id="board">
          <div class="grid-2048__cells" id="cells"></div>
          <div id="tiles"></div>
        </div>
        <div class="overlay__panel is-hidden" id="overlay">
          <h2 class="overlay__title" id="ov-title">遊戲結束</h2>
          <p class="overlay__text" id="ov-text"></p>
          <button class="btn btn--primary" id="ov-btn">再玩一次</button>
        </div>
      </div>

      <div class="game-controls">
        <button class="btn btn--ghost btn--sm" id="newBtn">🔄 新的一局</button>
      </div>

      <div class="dpad" id="dpad">
        <button class="u" data-dir="up" aria-label="上">▲</button>
        <button class="l" data-dir="left" aria-label="左">◀</button>
        <span class="c"></span>
        <button class="r" data-dir="right" aria-label="右">▶</button>
        <button class="d" data-dir="down" aria-label="下">▼</button>
      </div>

      <p class="tip">用 <kbd>方向鍵</kbd> / <kbd>WASD</kbd> 或滑動來移動方块。數字相同的會合併!</p>
    </div>

    <div class="ad-slot"></div>
  </main>

  <script src="js/ads.js" defer></script>
  <script>
  (function () {
    "use strict";
    var SIZE = 4;
    var board = document.getElementById("board");
    var cellsEl = document.getElementById("cells");
    var tilesEl = document.getElementById("tiles");
    var scoreEl = document.getElementById("score");
    var bestEl = document.getElementById("best");
    var overlay = document.getElementById("overlay");
    var ovTitle = document.getElementById("ov-title");
    var ovText = document.getElementById("ov-text");
    var ovBtn = document.getElementById("ov-btn");
    var newBtn = document.getElementById("newBtn");
    var dpad = document.getElementById("dpad");

    // build the static background cells
    for (var i = 0; i < SIZE * SIZE; i++) {
      var s = document.createElement("span");
      cellsEl.appendChild(s);
    }

    var COLORS = {
      2:    ["#3a3f52", "#c7d2fe"],
      4:    ["#4a4f66", "#e0e7ff"],
      8:    ["#f5a524", "#1a1206"],
      16:   ["#f5910a", "#1a1206"],
      32:   ["#ef6f2c", "#2a0d02"],
      64:   ["#ef4444", "#2a0606"],
      128:  ["#facc15", "#1a1500"],
      256:  ["#eab308", "#1a1500"],
      512:  ["#84cc16", "#0c1500"],
      1024: ["#22c55e", "#04150a"],
      2048: ["#22d3ee", "#00171a"]
    };
    function colorFor(v) {
      return COLORS[v] || ["#7c5cff", "#0b0d12"];
    }

    var tiles = [];      // {id, value, r, c, el}
    var nextId = 1;
    var score = 0;
    var best = +(localStorage.getItem("g2048_best") || 0);
    var won = false;
    var over = false;

    function tileEl(t) {
      var el = document.createElement("div");
      el.className = "tile" + (t.value >= 128 ? " tile--big" : "");
      el.textContent = t.value;
      paint(el, t.value);
      return el;
    }
    function paint(el, v) {
      var c = colorFor(v);
      el.style.background = c[0];
      el.style.color = c[1];
    }
    function place(el, r, c) {
      el.style.setProperty("--r", r);
      el.style.setProperty("--c", c);
    }

    function addTile(t, spawn) {
      t.el = tileEl(t);
      if (spawn) t.el.classList.add("spawn");
      place(t.el, t.r, t.c);
      tilesEl.appendChild(t.el);
    }

    function emptyCells() {
      var occ = {};
      tiles.forEach(function (t) { occ[t.r + "," + t.c] = 1; });
      var out = [];
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++)
          if (!occ[r + "," + c]) out.push([r, c]);
      return out;
    }

    function spawnRandom() {
      var empty = emptyCells();
      if (!empty.length) return;
      var pos = empty[(Math.random() * empty.length) | 0];
      var value = Math.random() < 0.9 ? 2 : 4;
      var t = { id: nextId++, value: value, r: pos[0], c: pos[1] };
      addTile(t, true);
      tiles.push(t);
    }

    function updateScore() {
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem("g2048_best", best);
      }
      bestEl.textContent = best;
    }

    function findTile(r, c) {
      for (var i = 0; i < tiles.length; i++)
        if (tiles[i].r === r && tiles[i].c === c) return tiles[i];
      return null;
    }

    function mergeTiles(a, b) {
      a.value = a.value * 2;
      a.r = b.r; a.c = b.c;
      paint(a.el, a.value);
      a.el.classList.toggle("tile--big", a.value >= 128);
      a.el.classList.add("pop");
      score += a.value;
      if (a.value === 2048 && !won) { won = true; showOverlay("你達到 2048!", "太厲害了,要不要挑戰更高的分數?"); }
      // b slides onto a's spot (visually absorbed) and is removed
      b.el.classList.add("tile--absorb");
      tiles = tiles.filter(function (t) { return t.id !== b.id; });
      setTimeout(function () { b.el.remove(); }, 120);
    }

    // move all tiles in one direction; compact + merge in a single pass
    // "line" is the axis that stays fixed (a row for L/R, a column for U/D).
    // Tiles are processed from the target wall inward, placed at the next
    // open slot, and merged with the tile just ahead if values match.
    function move(dir) {
      if (over) return;
      var horizontal = dir === "left" || dir === "right";
      var towardLow = dir === "left" || dir === "up"; // wall at index 0
      var start = towardLow ? 0 : SIZE - 1;
      var step = towardLow ? 1 : -1;
      var moved = false;

      tiles.forEach(function (t) { t.merged = false; });

      for (var line = 0; line < SIZE; line++) {
        // collect this line's tiles; k walks the travel axis in ascending order
        var stack = [];
        for (var k = 0; k < SIZE; k++) {
          var r = horizontal ? line : k; // horizontal: row fixed, c travels
          var c = horizontal ? k : line; // vertical: col fixed, r travels
          var t = findTile(r, c);
          if (t) stack.push(t);
        }
        // process from the wall inward: right/down (wall at high index) → reverse
        if (!towardLow) stack.reverse();

        var pos = start;
        var prev = null;
        for (var idx = 0; idx < stack.length; idx++) {
          var t = stack[idx];
          if (prev && prev.value === t.value && !prev.merged) {
            // merge t into prev (prev keeps its slot)
            t.r = prev.r; t.c = prev.c;
            place(t.el, t.r, t.c);
            prev.merged = true;
            moved = true;
            mergeTiles(prev, t);
            prev = null;
          } else {
            var nr = horizontal ? t.r : pos; // vertical: row travels
            var nc = horizontal ? pos : t.c; // horizontal: col travels
            if (t.r !== nr || t.c !== nc) moved = true;
            t.r = nr; t.c = nc;
            place(t.el, t.r, t.c);
            pos += step;
            prev = t;
          }
        }
      }

      if (moved) {
        spawnRandom();
        updateScore();
        if (isGameOver()) { over = true; showOverlay("遊戲結束", "得分 " + score + ",再試一次?"); }
      }
    }

    function isGameOver() {
      if (emptyCells().length) return false;
      for (var r = 0; r < SIZE; r++)
        for (var c = 0; c < SIZE; c++) {
          var t = findTile(r, c);
          if (c + 1 < SIZE) { var n = findTile(r, c + 1); if (n && n.value === t.value) return false; }
          if (r + 1 < SIZE) { var d = findTile(r + 1, c); if (d && d.value === t.value) return false; }
        }
      return true;
    }

    function showOverlay(title, text) {
      ovTitle.textContent = title;
      ovText.textContent = text;
      overlay.classList.remove("is-hidden");
    }
    function hideOverlay() { overlay.classList.add("is-hidden"); }

    function newGame() {
      tiles.forEach(function (t) { t.el.remove(); });
      tiles = [];
      score = 0;
      won = false;
      over = false;
      hideOverlay();
      spawnRandom();
      spawnRandom();
      updateScore();
    }

    // keyboard
    var KEYMAP = {
      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
      w: "up", s: "down", a: "left", d: "right",
      W: "up", S: "down", A: "left", D: "right"
    };
    document.addEventListener("keydown", function (e) {
      var dir = KEYMAP[e.key];
      if (!dir) return;
      e.preventDefault();
      move(dir);
    });

    // touch / swipe
    var touch = null;
    board.addEventListener("touchstart", function (e) {
      touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    board.addEventListener("touchend", function (e) {
      if (!touch) return;
      var dx = e.changedTouches[0].clientX - touch.x;
      var dy = e.changedTouches[0].clientY - touch.y;
      var ax = Math.abs(dx), ay = Math.abs(dy);
      if (Math.max(ax, ay) < 24) { touch = null; return; }
      move(ax > ay ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      touch = null;
    });

    // d-pad
    dpad.querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () { move(b.getAttribute("data-dir")); });
    });

    ovBtn.addEventListener("click", newGame);
    newBtn.addEventListener("click", newGame);

    bestEl.textContent = best;
    newGame();
  })();
  </script>
</body>
</html>
